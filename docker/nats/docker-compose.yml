services:
  nats:
    image: nats:2-alpine
    command:
      - --config=/etc/nats/nats-server.conf
    volumes:
      - ./conf/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    ports:
      - 4222:4222 # service port
      - 6222:6222 # cluster port
      - 8222:8222 # monitor port

  nats-cli:
    image: natsio/nats-box:latest
    entrypoint: /bin/sh
    command: -c "while true; do sleep 3600; done"
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./conf:/opt/conf
    depends_on:
      - nats

volumes:
  nats-data:
