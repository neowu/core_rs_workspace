[workspace]
resolver = "3"
members = ["app/*", "benchmark/*", "lib/*", "test/*"]
default-members = ["app/*", "lib/*"]

[workspace.package]
version = "0.9.8"

[workspace.dependencies]
framework = { path = "lib/framework" }
framework_clickhouse = { path = "lib/framework_clickhouse" }
framework_db = { path = "lib/framework_db" }
framework_kafka = { path = "lib/framework_kafka" }
framework_macro = { path = "lib/framework_macro" }
framework_nats = { path = "lib/framework_nats" }

serde = { version = "*", features = ["derive"] }
tokio = { version = "*", features = ["full"] }
uuid = { version = "*", features = ["serde", "v7"] }

