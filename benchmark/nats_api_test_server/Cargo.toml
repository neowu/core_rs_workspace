[package]
name = "nats_api_test_server"
version.workspace = true
edition = "2024"

[dependencies]
# by path rather than workspace, because `default-features = false` cannot override an inherited
# dependency: it keeps framework's own #[global_allocator] out so the process wide counter below
# still links, and run_nats_api_test.sh turns framework/alloc_stats back on for every other run,
# since that is what apps ship
framework = { path = "../../lib/framework", default-features = false }
framework_nats = { path = "../../lib/framework_nats", default-features = false }
framework_macro.workspace = true
harness = { path = "../harness" }

serde.workspace = true
tokio.workspace = true

[features]
# process wide heap accounting, see ../harness/src/alloc_stats.rs; mutually exclusive with
# framework/alloc_stats, the two install a #[global_allocator] each
alloc_stats = ["harness/alloc_stats"]
