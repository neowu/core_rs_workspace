[package]
name = "framework_db"
version.workspace = true
edition = "2024"

[dependencies]
framework = { workspace = true }
tokio.workspace = true
tokio-postgres = { version = "*", features = ["default", "with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
# data_type maps framework's date types to the postgres binary format itself
bytes = "*"
postgres-protocol = "*"

[lints]
workspace = true
