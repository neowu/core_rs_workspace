[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
serde.workspace = true
serde_json = "*"
serde_html_form = "*"
smallvec = { version = "1", features = ["serde"] }

time = { version = "*", features = ["formatting", "parsing"] }

tokio.workspace = true
tokio-util = { version = "*", features = ["rt"] }
tokio-stream = "*"

http = "*"
axum.workspace = true
axum-extra = { version = "*", features = ["cookie"] }
tower-http = {version ="*", features = ["fs"]}

reqwest = { version = "0", features = ["stream"] }

# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
tracing = { version = "*", features = ["release_max_level_off"] }
log = { version = "*", features = ["release_max_level_off"] }

futures = "*"
pin-project-lite = "*"
bytes = "*"
libc = "*"
rand = "*"

[features]
# per-action heap accounting, see src/log/alloc_stats.rs, off by default because it is not free;
# it installs a #[global_allocator], so it cannot be combined with http_test_server/alloc_stats
alloc_stats = []

[lints]
workspace = true
