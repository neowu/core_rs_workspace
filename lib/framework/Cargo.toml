[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
serde.workspace = true
serde_json = "*"
serde_html_form = "*"

time = { version = "*", features = ["formatting", "parsing"] }

tokio.workspace = true
tokio-util = { version = "*", features = ["rt"] }
tokio-stream = "*"

http = "*"
axum.workspace = true
axum-extra = { version = "*", features = ["cookie"] }
tower-http = {version ="*", features = ["fs"]}

reqwest = { version = "0", features = ["stream"] }

futures = "*"
pin-project-lite = "*"
bytes = "*"
libc = "*"
rand = "*"

[lints]
workspace = true
