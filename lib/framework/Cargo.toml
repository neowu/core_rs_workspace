[package]
name = "framework"
version.workspace = true
edition = "2024"

[lib]
doctest = false

[dependencies]
bytes.workspace = true
futures.workspace = true
http = "1"
http-body = "1"
http-body-util = "0"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "tokio"] }
libc.workspace = true
memchr = "2"
percent-encoding = "2"
pin-project-lite = "0"
rand = "0"
rustls-platform-verifier = "0"
serde.workspace = true
serde_html_form = "0"
serde_json.workspace = true
smallvec = { version = "1", features = ["serde"] }
socket2 = "0"
time = { version = "0", features = ["formatting", "macros", "parsing"] }
tokio.workspace = true
tokio-rustls = "0"
tokio-stream = "0"
tokio-util = { workspace = true, features = ["io", "rt"] }

# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
log = { version = "0", features = ["release_max_level_off"] }
tracing = { version = "0", features = ["release_max_level_off"] }

[lints]
workspace = true
