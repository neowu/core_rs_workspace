[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "tokio"] }
libc.workspace = true
memchr.workspace = true
percent-encoding.workspace = true
pin-project-lite.workspace = true
rand.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
smallvec = { workspace = true, features = ["serde"] }
socket2.workspace = true
time = { workspace = true, features = ["formatting", "macros", "parsing"] }
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }

# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
log.workspace = true
tracing.workspace = true

[lints]
workspace = true
