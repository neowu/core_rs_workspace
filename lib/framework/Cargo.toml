[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
serde.workspace = true
tokio.workspace = true

bytes = "*"
futures = "*"
http = "*"
http-body = "*"
http-body-util = "*"
hyper = { version = "*", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "*", features = ["server-auto", "server-graceful", "tokio"] }
libc = "*"
log = { version = "*", features = ["release_max_level_off"] }
memchr = "*"
percent-encoding = "*"
pin-project-lite = "*"
rand = "*"
rustls-platform-verifier = "*"
serde_html_form = "*"
serde_json = "*"
smallvec = { version = "1", features = ["serde"] }
socket2 = "*"
time = { version = "*", features = ["formatting", "macros", "parsing"] }
tokio-rustls = "*"
tokio-stream = "*"
tokio-util = { version = "*", features = ["io", "rt"] }
# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
tracing = { version = "*", features = ["release_max_level_off"] }

[lints]
workspace = true
