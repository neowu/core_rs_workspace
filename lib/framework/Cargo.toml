[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
serde.workspace = true
serde_json = "*"
serde_html_form = "*"
smallvec = { version = "1", features = ["serde"] }

time = { version = "*", features = ["formatting", "parsing"] }

tokio.workspace = true
tokio-util = { version = "*", features = ["rt"] }
tokio-stream = "*"

http = "*"
axum.workspace = true
axum-extra = { version = "*", features = ["cookie"] }
tower-http = {version ="*", features = ["fs"]}

reqwest = { version = "0", features = ["stream"] }

# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
tracing = { version = "*", features = ["release_max_level_off"] }
log = { version = "*", features = ["release_max_level_off"] }

futures = "*"
pin-project-lite = "*"
bytes = "*"
libc = "*"
rand = "*"

[features]
default = ["alloc_stats"]
# per-action heap accounting, see src/log/alloc_stats.rs, on by default: benchmarked at under 1% of
# http server throughput, which is inside the run to run spread, so every app gets it.
# it installs a #[global_allocator], so a crate graph that wants its own allocator -- an app on
# jemalloc, or http_test_server/alloc_stats -- has to take framework with default-features = false
alloc_stats = []

[lints]
workspace = true
