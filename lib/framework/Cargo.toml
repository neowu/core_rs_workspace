[package]
name = "framework"
version.workspace = true
edition = "2024"

[dependencies]
serde.workspace = true
serde_json = "*"
serde_html_form = "*"
smallvec = { version = "1", features = ["serde"] }

time = { version = "*", features = ["formatting", "parsing", "macros"] }

tokio.workspace = true
tokio-util = { version = "*", features = ["rt", "io"] }
tokio-stream = "*"
tokio-rustls = "*"
rustls-platform-verifier = "*"

http = "*"
http-body = "*"
http-body-util = "*"
hyper = { version = "*", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "*", features = ["tokio", "server-auto", "server-graceful"] }
percent-encoding = "*"
socket2 = "*"

# dependency-only, for their compile time max level features; see spec/third_party_instrumentation.md
tracing = { version = "*", features = ["release_max_level_off"] }
log = { version = "*", features = ["release_max_level_off"] }

futures = "*"
pin-project-lite = "*"
bytes = "*"
libc = "*"
memchr = "*"
rand = "*"

[lints]
workspace = true
