[package]
name = "framework_clickhouse"
version.workspace = true
edition = "2024"

[lib]
doctest = false

[dependencies]
framework.workspace = true
framework_macro.workspace = true

clickhouse = { version = "0", features = ["inserter", "rustls-tls"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "tls12", "webpki-tokio"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }  # same as clickhouse's rustls-tls feature, to build its http client with FallbackDnsResolver
rustls = { version = "0", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
tower-service = "0"  # for FallbackDnsResolver to be used as hyper-util legacy client resolver

[lints]
workspace = true
